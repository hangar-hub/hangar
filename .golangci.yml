version: "2"

run:
  timeout: 10m
  build-tags: [integration, compat, pins, helm]

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - unused
    - misspell
    - bodyclose
    - errorlint
    - nilerr
    - copyloopvar
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: UK
      # Wire-format and upstream names that use US spelling.
      ignore-rules: [unauthorized, modeling, authorization, normalize, serialize, color, initialize]
    gosec:
      excludes:
        # Subprocesses take arguments built by Hangar, never shell strings.
        - G204
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
  exclusions:
    generated: strict
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      - path: (^|/)[a-z]+test/
        linters: [gosec]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/jamesagarside/hangar]
