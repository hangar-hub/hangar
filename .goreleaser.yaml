# GoReleaser builds the hangar binaries, archives, checksums, SBOMs and
# cosign signatures, and updates the Homebrew tap (docs/spec/12-packaging-and-release.md).
# The container image and the Helm chart are built by .github/workflows/release.yml.
#
# Check the file with `goreleaser check`; try a local build with
# `goreleaser release --snapshot --clean --skip=sign,sbom,publish`, or run
# the whole pipeline, SBOMs and signing included, with
# `make release-rehearsal`.
version: 2

project_name: hangar

before:
  hooks:
    # The UI is embedded in the binary, so it is built once before every target.
    - corepack enable
    - make ui
    # Shell completion scripts for the archives and the cask.
    - ./scripts/completions.sh

builds:
  - id: hangar
    main: ./cmd/hangar
    binary: hangar
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: hangar
    ids: [hangar]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - completions/*

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]

signs:
  # Keyless signing with the workflow's GitHub OIDC identity. cosign 3 (what
  # sigstore/cosign-installer installs) writes the signature, certificate and
  # transparency log entry into one Sigstore bundle; it ignores
  # --output-certificate and fails without --bundle. Verify a release with:
  #   cosign verify-blob --bundle checksums.txt.sigstore.json \
  #     --certificate-identity-regexp '^https://github.com/hangar-hub/hangar/.github/workflows/release.yml@refs/tags/v.+$' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
  # scripts/release-rehearsal.sh runs this block with a throwaway key.
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  # release-please writes CHANGELOG.md; the GitHub release reuses it.
  disable: true

release:
  github:
    owner: hangar-hub
    name: hangar
  # release-please creates the release, with its changelog entry as the
  # notes, before it pushes the tag that starts release.yml. GoReleaser finds
  # that release by tag, adds the files to it, and with mode append adds its
  # own notes after release-please's. The changelog pipe is off, so its notes
  # are only this footer. (keep-existing, the default, would drop the footer.)
  # Re-running the binaries job of a release appends the footer again; delete
  # the copy from the release notes by hand.
  mode: append
  footer: |
    ## Install

    ```sh
    docker run -d --name hangar -p 8080:8080 -v hangar:/var/lib/hangar \
      -e HANGAR_SERVER_PUBLIC_URL=http://localhost:8080 \
      ghcr.io/hangar-hub/hangar:{{ .Version }}
    helm install hangar oci://ghcr.io/hangar-hub/charts/hangar --version {{ .Version }} \
      --set publicURL=https://hangar.example.com
    brew install --cask hangar-hub/tap/hangar
    ```

    The image is for linux/amd64 and linux/arm64. The archives below are for Linux, macOS and Windows, with an SPDX SBOM for each. Before you upgrade an Instance, read [Upgrade Hangar](https://hangar.page/latest/operate/upgrades/) and back it up.

    ## Verify

    The image, the Helm chart and `checksums.txt` are signed with cosign keyless signing by the release workflow:

    ```sh
    id=https://github.com/hangar-hub/hangar/.github/workflows/release.yml@refs/tags/{{ .Tag }}
    issuer=https://token.actions.githubusercontent.com
    cosign verify ghcr.io/hangar-hub/hangar:{{ .Version }} --certificate-identity "$id" --certificate-oidc-issuer "$issuer"
    cosign verify ghcr.io/hangar-hub/charts/hangar:{{ .Version }} --certificate-identity "$id" --certificate-oidc-issuer "$issuer"
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json --certificate-identity "$id" --certificate-oidc-issuer "$issuer"
    ```

    [Security hardening](https://hangar.page/latest/operate/security/#verify-the-image) also shows how to check the SBOM attestation and build provenance.

    Hangar is source-available under the [Elastic License 2.0](https://github.com/hangar-hub/hangar/blob/{{ .Tag }}/LICENSE).

homebrew_casks:
  - name: hangar
    ids: [hangar]
    repository:
      owner: hangar-hub
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://hangar.page/
    description: Self-hosted model and dataset hub, compatible with the Hugging Face Hub
    license: Elastic-2.0
    completions:
      bash: completions/hangar.bash
      zsh: completions/hangar.zsh
      fish: completions/hangar.fish
    commit_author:
      name: hangar-release
      email: hangar-release@users.noreply.github.com
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/hangar"]
          end
