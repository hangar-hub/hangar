# Artifact Hub repository metadata for the chart at
# oci://ghcr.io/hangar-hub/charts/hangar. Artifact Hub reads it from the
# special tag artifacthub.io in that repository, not from git; push it by hand
# as docs/spec/12-packaging-and-release.md ("Artifact Hub") describes.
#
# owners lets the people listed claim the repository on Artifact Hub. Each
