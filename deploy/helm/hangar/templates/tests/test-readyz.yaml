apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hangar.fullname" . }}-test-readyz
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  # No HANGAR_SERVICE_HOST and the like from the Service; Hangar rejects
  # unknown HANGAR_* variables.
  enableServiceLinks: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readyz
      # The Hangar image has no shell or curl; it checks itself with the
      # same healthcheck command the container HEALTHCHECK uses.
      image: {{ include "hangar.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # helm install --wait returns as soon as the Pod is ready, but the
      # Service routes to it only once the cluster's Service proxy
      # (kube-proxy, Cilium) has caught up, and refuses connections until
      # then. --retry-for rides that out; a /readyz answer other than 200
      # still fails at once.
      args: ["healthcheck", "--retry-for", "30s", "--set", "server.listen={{ include "hangar.fullname" . }}:{{ .Values.service.port }}"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
