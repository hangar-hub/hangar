apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hangar.fullname" . }}-test-readyz
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readyz
      # The Hangar image has no shell or curl; it checks itself with the
      # same healthcheck command the container HEALTHCHECK uses.
      image: {{ include "hangar.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: ["healthcheck", "--set", "server.listen={{ include "hangar.fullname" . }}:{{ .Values.service.port }}"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
