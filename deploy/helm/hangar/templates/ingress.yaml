{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hangar.fullname" . }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- $hosts := list .host }}
    {{- if $.Values.ingress.datasetsServerHost }}
    {{- $hosts = append $hosts (printf "datasets-server.%s" .host) }}
    {{- end }}
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hangar.fullname" $ }}
                port:
                  name: http
    {{- end }}
    {{- end }}
{{- end }}
