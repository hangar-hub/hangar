{{- if .Values.httpRoute.enabled }}
{{- $hosts := .Values.httpRoute.hostnames }}
{{- if .Values.httpRoute.datasetsServerHost }}
{{- range .Values.httpRoute.hostnames }}
{{- $hosts = append $hosts (printf "datasets-server.%s" .) }}
{{- end }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "hangar.fullname" . }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml $hosts | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ include "hangar.fullname" . }}
          port: {{ .Values.service.port }}
      # Streaming downloads and uploads have no total timeout (02-architecture.md).
      timeouts:
        request: "0s"
{{- end }}
