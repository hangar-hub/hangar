{{- if and .Values.secrets (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hangar.fullname" . }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- if include "hangar.generate" . }}
{{- /*
The generated values are kept by reading the Secret back with lookup. Where
lookup cannot reach the cluster (helm template, helm lint, --dry-run=client,
Argo CD), every render would make a new Instance key and password, and
applying one would lock Hangar out of everything it has encrypted. Stop
instead.
*/}}
{{- if not (include "hangar.lookupWorks" .) }}
{{- fail "generateSecrets needs to read the cluster to keep the generated Instance key and admin password, and this render cannot: helm template, helm lint, --dry-run=client and Argo CD give the chart no cluster access, so each render would make new ones. Create a Secret with HANGAR_SECURITY_INSTANCE_KEY and HANGAR_SECURITY_BOOTSTRAP_ADMIN_PASSWORD, and set existingSecret to its name. With persistence on, generateSecrets: false also works: Hangar then generates both on its volume. See https://jamesagarside.github.io/hangar/get-started/helm/#run-with-argo-cd" }}
{{- end }}
{{- $name := printf "%s-generated" (include "hangar.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- $password := "" }}
{{- if and $existing $existing.data }}
{{- $key = index $existing.data "HANGAR_SECURITY_INSTANCE_KEY" | b64dec }}
{{- $password = index $existing.data "HANGAR_SECURITY_BOOTSTRAP_ADMIN_PASSWORD" | b64dec }}
{{- end }}
{{- if not $key }}
{{- $key = randAscii 32 | b64enc }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 24 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall, so a reinstall over the same data keeps working.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  HANGAR_SECURITY_INSTANCE_KEY: {{ $key | quote }}
  {{- if include "hangar.generatePassword" . }}
  HANGAR_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: {{ $password | quote }}
  {{- end }}
{{- end }}
