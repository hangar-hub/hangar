{{- if and .Values.migrations.enabled (not .Values.persistence.enabled) }}
{{- /*
Runs `hangar admin migrate` before web and worker Pods start. Hooks run
before the release's own ConfigMap and Secret exist, so the Job gets its own
copies, which Helm deletes once it succeeds.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hangar.fullname" . }}-migrate
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  hangar.yaml: |
    {{- include "hangar.config" . | nindent 4 }}
{{- if and .Values.secrets (not .Values.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hangar.fullname" . }}-migrate
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hangar.fullname" . }}-migrate
  labels:
    {{- include "hangar.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "hangar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ if .Values.serviceAccount.create }}default{{ else }}{{ include "hangar.serviceAccountName" . }}{{ end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "hangar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["admin", "migrate"]
          env:
            - name: HANGAR_CONFIG
              value: /etc/hangar/hangar.yaml
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- else if .Values.secrets }}
            - secretRef:
                name: {{ include "hangar.fullname" . }}-migrate
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/hangar, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: {{ include "hangar.fullname" . }}-migrate
        - name: tmp
          emptyDir: {}
{{- end }}
