# Hangar in role all with Postgres and MinIO, the setup to grow from. The
# MinIO bucket is created on start.
#
#   docker compose -f postgres-minio.yaml up -d
#   docker compose -f postgres-minio.yaml logs hangar   # the generated admin password
#
# Change the example passwords before you put anything real in it.
name: hangar-postgres-minio

x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hangar-example-password}
      POSTGRES_DB: hangar
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hangar", "-d", "hangar"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: *minio-image
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: hangar
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hangar-example-secret}
    ports:
      - "9001:9001" # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: *minio-image
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["sh", "-c"]
    command:
      - mc alias set local http://minio:9000 hangar "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/hangar
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hangar-example-secret}

  hangar:
    image: ${HANGAR_IMAGE:-ghcr.io/jamesagarside/hangar:latest}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports:
      - "${HANGAR_PORT:-8080}:8080"
    environment:
      HANGAR_SERVER_PUBLIC_URL: ${HANGAR_PUBLIC_URL:-http://localhost:8080}
      # Empty generates a password on first start and prints it once.
      HANGAR_SECURITY_BOOTSTRAP_ADMIN_PASSWORD: ${HANGAR_ADMIN_PASSWORD:-}
      HANGAR_DATABASE_DRIVER: postgres
      HANGAR_DATABASE_DSN: postgres://hangar:${POSTGRES_PASSWORD:-hangar-example-password}@postgres:5432/hangar?sslmode=disable
      HANGAR_STORAGE_BACKEND: s3
      HANGAR_STORAGE_S3_ENDPOINT: http://minio:9000
      HANGAR_STORAGE_S3_REGION: us-east-1
      HANGAR_STORAGE_S3_BUCKET: hangar
      HANGAR_STORAGE_S3_USE_PATH_STYLE: "true"
      HANGAR_STORAGE_S3_ACCESS_KEY_ID: hangar
      HANGAR_STORAGE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-hangar-example-secret}
      # MinIO is not reachable from your browser at http://minio:9000, so
      # downloads stream through Hangar instead of redirecting.
      HANGAR_STORAGE_S3_DOWNLOAD_MODE: proxy
    volumes:
      # Only secrets.yaml (the generated Instance key and admin password).
      - hangar-data:/var/lib/hangar
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/hangar:uid=65532,gid=65532

volumes:
  postgres-data:
  minio-data:
  hangar-data:
