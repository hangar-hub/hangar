[project]
name = "hangar-compat"
version = "0.0.0"
description = "Client compatibility suites for Hangar."
requires-python = ">=3.10"
license = "Elastic-2.0"
dependencies = [
  "pytest==9.1.1",
  "requests==2.34.2",
  "huggingface_hub==2.2.0",
  "transformers==5.19.0",
  "torch==2.14.1",
  "datasets==5.1.0",
  "sentence-transformers==5.7.0",
]

[tool.uv]
package = false
# filelock 4.2.1, which fixes GHSA-v4x8-3wr5-3wq8 and five other advisories
# for 3.20.4 to 4.2.0, needs Python 3.11. Python 3.10, which the floor
# client cell runs, takes 3.20.3: the newest release outside every filelock
# advisory.
constraint-dependencies = ["filelock==3.20.3; python_full_version < '3.11'"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
