[project]
name = "hangar-compat"
version = "0.0.0"
description = "Client compatibility suites for Hangar."
requires-python = ">=3.10"
license = "Elastic-2.0"
dependencies = [
  "pytest==9.1.1",
  "requests==2.34.2",
  "huggingface_hub==2.2.0",
  "transformers==5.19.0",
  "torch==2.14.1",
  "datasets==5.1.0",
  "sentence-transformers==5.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
