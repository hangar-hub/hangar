      summary: Remove an Upstream
      responses:
        "204": {description: Removed.}
        default: {$ref: "#/components/responses/Problem"}
  /admin/upstreams/{id}/test:
    post:
      tags: [admin]
      operationId: adminTestUpstream
      summary: Test the connection to an Upstream
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "200": {description: The result., content: {application/json: {schema: {$ref: "#/components/schemas/CheckResult"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admin/settings:
    get:
      tags: [admin]
      operationId: adminGetSettings
      summary: Get Instance settings
      responses:
        "200": {description: Settings., content: {application/json: {schema: {$ref: "#/components/schemas/InstanceSettings"}}}}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [admin]
      operationId: adminUpdateSettings
      summary: Change Instance settings
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/InstanceSettings"}}}
      responses:
        "200": {description: Settings., content: {application/json: {schema: {$ref: "#/components/schemas/InstanceSettings"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admin/storage:
    get:
      tags: [admin]
      operationId: adminGetStorage
      summary: Get storage usage by Namespace
      responses:
        "200": {description: Usage., content: {application/json: {schema: {$ref: "#/components/schemas/StorageUsage"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admin/quotas/{ns}:
    put:
      tags: [admin]
      operationId: adminSetQuota
      summary: Set a Namespace's storage quota
      parameters: [{$ref: "#/components/parameters/Ns"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Quota"}}}
      responses:
        "200": {description: The quota., content: {application/json: {schema: {$ref: "#/components/schemas/Quota"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admin/gc:
    post:
      tags: [admin]
      operationId: adminRunGC
      summary: Run garbage collection now
      responses:
        "202": {description: Started., content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admin/audit:
    get:
      tags: [admin]
      operationId: adminListAudit
      summary: List audit events
      parameters:
        - {name: actor, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: format, in: query, schema: {type: string, enum: [json, csv]}}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: Events, as JSON or CSV.
          content:
            application/json: {schema: {$ref: "#/components/schemas/AuditEventList"}}
            text/csv: {schema: {type: string}}
        default: {$ref: "#/components/responses/Problem"}
  /admin/system:
    get:
      tags: [admin]
      operationId: adminGetSystem
      summary: Get version, backends, telemetry and doctor results
      responses:
        "200": {description: System information., content: {application/json: {schema: {$ref: "#/components/schemas/SystemInfo"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admin/tokens:
    get:
      tags: [admin]
      operationId: adminListTokens
      summary: List every Token
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Tokens., content: {application/json: {schema: {$ref: "#/components/schemas/TokenList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admin/tokens/{id}:
    delete:
      tags: [admin]
      operationId: adminRevokeToken
      summary: Revoke any Token
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: Revoked.}
        default: {$ref: "#/components/responses/Problem"}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: hangar_session
      description: The UI session. State-changing calls also need the `X-CSRF-Token` header.
    bearer:
      type: http
      scheme: bearer
      description: A Hangar Token (`hgr_...`).

  parameters:
    RepoType: {name: type, in: path, required: true, schema: {$ref: "#/components/schemas/RepoTypePlural"}}
    Ns: {name: ns, in: path, required: true, description: Namespace name., schema: {type: string}}
    Name: {name: name, in: path, required: true, description: Repo name., schema: {type: string}}
    Rev: {name: rev, in: path, required: true, description: Revision, percent-encoded., schema: {type: string}}
    RevQuery: {name: rev, in: query, description: Revision; the default branch when absent., schema: {type: string}}
    FilePath: {name: path, in: path, required: true, description: Path in the Repo, percent-encoded with `/` as `%2F`., schema: {type: string}}
    SHA: {name: sha, in: path, required: true, schema: {type: string, pattern: "^[0-9a-f]{40}$"}}
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Num: {name: num, in: path, required: true, schema: {type: integer, minimum: 1}}
    Slug: {name: slug, in: path, required: true, schema: {type: string}}
    Recursive: {name: recursive, in: query, schema: {type: boolean, default: false}}
    Cursor: {name: cursor, in: query, description: Opaque cursor from a previous page., schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}

  responses:
    Problem:
      description: An RFC 9457 problem detail.
      content:
        application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [detail]
            properties:
              pointer: {type: string}
              parameter: {type: string}
              detail: {type: string}

    RepoTypePlural: {type: string, enum: [models, datasets]}
    RepoTypeSingular: {type: string, enum: [model, dataset]}
    Visibility: {type: string, enum: [public, internal, private]}
    Role: {type: string, enum: [read, write, admin]}
    Scope: {type: string, enum: [read, write, admin]}

    # Session and users
    Me:
      type: object
      required: [id, username, display_name, is_admin, orgs]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        email: {type: string}
        avatar_url: {type: string}
        is_admin: {type: boolean}
        orgs: {type: array, items: {$ref: "#/components/schemas/OrgMembership"}}
        csrf_token: {type: string, description: Send as X-CSRF-Token on state-changing calls.}
    OrgMembership:
      type: object
      required: [name, role]
      properties:
        name: {type: string}
        display_name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
    AuthProviders:
      type: object
      required: [local_login, providers, registration]
      properties:
        local_login: {type: boolean}
        registration: {type: string, enum: [open, invite, closed]}
        providers:
          type: array
          items:
            type: object
            required: [id, name, login_url]
            properties:
              id: {type: string}
              name: {type: string}
              login_url: {type: string}
    Session:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: {type: string, format: uuid}
        user_agent: {type: string}
        ip: {type: string}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        current: {type: boolean}
    SessionList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Session"}}, next_cursor: {type: string}}

    # Tokens and keys
    TokenRestrictions:
      type: object
      properties:
        namespaces: {type: array, items: {type: string}}
        repos: {type: array, items: {type: string, description: "type:namespace/name"}}
    Token:
      type: object
      required: [id, name, prefix, scope, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string}
        scope: {$ref: "#/components/schemas/Scope"}
        restrictions: {$ref: "#/components/schemas/TokenRestrictions"}
        username: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
    TokenList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Token"}}, next_cursor: {type: string}}
    TokenCreate:
      type: object
      required: [name, scope]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        scope: {$ref: "#/components/schemas/Scope"}
        restrictions: {$ref: "#/components/schemas/TokenRestrictions"}
        expires_at: {type: string, format: date-time}
    TokenCreated:
      allOf:
        - {$ref: "#/components/schemas/Token"}
        - type: object
          required: [secret]
          properties: {secret: {type: string, description: Shown once.}}
    DeviceDecision:
      type: object
      required: [user_code, approve]
      properties:
        user_code: {type: string}
        approve: {type: boolean}
    OllamaKey:
      type: object
      required: [id, fingerprint, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        fingerprint: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
    OllamaKeyList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/OllamaKey"}}}
    OllamaKeyCreate:
      type: object
      required: [public_key]
      properties:
        name: {type: string}
        public_key: {type: string, description: The contents of ~/.ollama/id_ed25519.pub.}
    UpstreamTokenStatus:
      type: object
      required: [upstream, saved]
      properties:
        upstream: {type: string}
        saved: {type: boolean}
        updated_at: {type: string, format: date-time}
    UpstreamTokenSet:
      type: object
      required: [token]
      properties: {token: {type: string, format: password}}

    # Search
    SearchResults:
      type: object
      required: [repos, namespaces, collections]
      properties:
        repos: {type: array, items: {$ref: "#/components/schemas/Repo"}}
        namespaces: {type: array, items: {$ref: "#/components/schemas/Namespace"}}
        collections: {type: array, items: {$ref: "#/components/schemas/Collection"}}

    # Repos
    Repo:
      type: object
      required: [id, type, namespace, name, visibility, default_branch, mirror, gated, created_at, updated_at, likes, downloads, size_bytes, lfs_bytes]
      properties:
        id: {type: string, description: namespace/name}
        uuid: {type: string, format: uuid}
        type: {$ref: "#/components/schemas/RepoTypeSingular"}
        namespace: {type: string}
        name: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
        description: {type: string}
        default_branch: {type: string}
        tags: {type: array, items: {type: string}}
        licence: {type: string}
        mirror: {type: boolean}
        mirror_status: {$ref: "#/components/schemas/MirrorSummary"}
        gated: {type: string, enum: ["", auto, manual]}
        sha: {type: string, description: Head of the default branch.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_modified: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        likes: {type: integer, format: int64}
        liked: {type: boolean}
        downloads: {type: integer, format: int64, description: Downloads in the last 30 days.}
        size_bytes: {type: integer, format: int64}
        lfs_bytes: {type: integer, format: int64}
        present_bytes: {type: integer, format: int64}
        summary: {$ref: "#/components/schemas/RepoSummary"}
        permissions: {$ref: "#/components/schemas/RepoPermissions"}
    RepoSummary:
      type: object
      description: Index highlights for cards and filters.
      properties:
        formats: {type: array, items: {type: string}}
        architecture: {type: string}
        parameters: {type: integer, format: int64}
        quants: {type: array, items: {type: string}}
        context_length: {type: integer, format: int64}
        pipeline_tag: {type: string}
        library_name: {type: string}
        scan_status: {type: string, enum: [safe, suspicious, unsafe, error, pending]}
    RepoPermissions:
      type: object
      required: [read, write, admin, discuss]
      properties:
        read: {type: boolean}
        write: {type: boolean}
        admin: {type: boolean}
        discuss: {type: boolean}
        pull_mirror: {type: boolean}
    RepoList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Repo"}}
        next_cursor: {type: string}
        facets:
          type: object
          additionalProperties: {type: object, additionalProperties: {type: integer}}
    RepoCreate:
      type: object
      required: [type, namespace, name]
      properties:
        type: {$ref: "#/components/schemas/RepoTypeSingular"}
        namespace: {type: string}
        name: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
        description: {type: string}
        licence: {type: string}
        readme: {type: boolean, description: Add a starter README.md.}
    RepoUpdate:
      type: object
      properties:
        description: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
        default_branch: {type: string}
        tags: {type: array, items: {type: string}}
        licence: {type: string}
        gating: {$ref: "#/components/schemas/Gating"}
    Gating:
      type: object
      properties:
        mode: {type: string, enum: ["", auto, manual]}
        prompt: {type: string}
        fields:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: {type: string}
              type: {type: string, enum: [text, checkbox, country, date, select]}
              required: {type: boolean}
    RenameRequest:
      type: object
      required: [name]
      properties: {name: {type: string}}
    TransferRequest:
      type: object
      required: [namespace]
      properties: {namespace: {type: string}}
    Ref:
      type: object
      required: [name, ref, target_commit]
      properties:
        name: {type: string}
        ref: {type: string}
        target_commit: {type: string}
    Refs:
      type: object
      required: [branches, tags, converts, pull_requests]
      properties:
        branches: {type: array, items: {$ref: "#/components/schemas/Ref"}}
        tags: {type: array, items: {$ref: "#/components/schemas/Ref"}}
        converts: {type: array, items: {$ref: "#/components/schemas/Ref"}}
        pull_requests: {type: array, items: {$ref: "#/components/schemas/Ref"}}
    Signature:
      type: object
      required: [name, email, date]
      properties:
        name: {type: string}
        email: {type: string}
        date: {type: string, format: date-time}
        username: {type: string}
    CommitInfo:
      type: object
      required: [sha, parents, author, committer, title, message]
      properties:
        sha: {type: string}
        parents: {type: array, items: {type: string}}
        author: {$ref: "#/components/schemas/Signature"}
        committer: {$ref: "#/components/schemas/Signature"}
        title: {type: string}
        message: {type: string}
    CommitList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/CommitInfo"}}, next_cursor: {type: string}}
    FileChange:
      type: object
      required: [path, status, lfs, binary]
      properties:
        path: {type: string}
        old_path: {type: string}
        status: {type: string, enum: [added, modified, deleted, renamed]}
        old_oid: {type: string}
        new_oid: {type: string}
        old_size: {type: integer, format: int64}
        new_size: {type: integer, format: int64}
        lfs: {type: boolean}
        binary: {type: boolean}
    CommitDetail:
      allOf:
        - {$ref: "#/components/schemas/CommitInfo"}
        - type: object
          required: [changes]
          properties: {changes: {type: array, items: {$ref: "#/components/schemas/FileChange"}}}
    FileDiff:
      allOf:
        - {$ref: "#/components/schemas/FileChange"}
        - type: object
          properties: {patch: {type: string, description: Unified diff; empty for LFS, binary and large files.}}
    LastCommit:
      type: object
      required: [sha, title, date]
      properties:
        sha: {type: string}
        title: {type: string}
        date: {type: string, format: date-time}
    TreeEntry:
      type: object
      required: [path, type, size, oid, present]
      properties:
        path: {type: string}
        type: {type: string, enum: [file, directory]}
        size: {type: integer, format: int64}
        oid: {type: string}
        lfs:
          type: object
          required: [oid, size, pointer_size]
          properties:
            oid: {type: string}
            size: {type: integer, format: int64}
            pointer_size: {type: integer}
        present: {type: boolean, description: False for files not in the Arsenal.}
        scan_status: {type: string, enum: [safe, suspicious, unsafe, error, pending]}
        last_commit: {$ref: "#/components/schemas/LastCommit"}
    TreeListing:
      type: object
      required: [commit, items]
      properties:
        commit: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/TreeEntry"}}
        next_cursor: {type: string}
    RepoMetadata:
      type: object
      required: [commit, status]
      properties:
        commit: {type: string}
        status: {type: string, enum: [ready, pending]}
        summary: {type: object, additionalProperties: true, description: The index summary (07-indexing-and-scanning.md).}
        indexed_at: {type: string, format: date-time}
    FileHeader:
      type: object
      required: [format, header]
      properties:
        format: {type: string, enum: [safetensors, gguf]}
        header: {type: object, additionalProperties: true}
    QuantGroup:
      type: object
      required: [name, files, size, present]
      properties:
        name: {type: string}
        files: {type: array, items: {type: string}}
        projectors: {type: array, items: {type: string}}
        size: {type: integer, format: int64}
        present: {type: boolean}
    QuantList:
      type: object
      required: [commit, items]
      properties:
        commit: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/QuantGroup"}}
    Dependency:
      type: object
      required: [repo, type, kind, required, arsenal]
      properties:
        repo: {type: string}
        type: {$ref: "#/components/schemas/RepoTypeSingular"}
        revision: {type: string}
        kind: {type: string, enum: [code, base_model, adapter_base, card_base_model, dataset]}
        required: {type: boolean}
        source_path: {type: string}
        source_key: {type: string}
        arsenal: {$ref: "#/components/schemas/ArsenalState"}
    Dependencies:
      type: object
      required: [needs, needed_by]
      properties:
        needs: {type: array, items: {$ref: "#/components/schemas/Dependency"}}
        needed_by: {type: array, items: {$ref: "#/components/schemas/Dependency"}}
    ArsenalState: {type: string, enum: [none, partial, full]}
    LikeStatus:
      type: object
      required: [liked, likes]
      properties:
        liked: {type: boolean}
        likes: {type: integer, format: int64}
    RepoStats:
      type: object
      required: [days, total]
      properties:
        total: {type: integer, format: int64}
        days:
          type: array
          items:
            type: object
            required: [day, count]
            properties:
              day: {type: string, format: date}
              count: {type: integer, format: int64}
    Collaborator:
      type: object
      required: [username, role]
      properties:
        username: {type: string}
        role: {type: string, enum: [read, write]}
    CollaboratorList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Collaborator"}}}
    AccessRequestStatus: {type: string, enum: [pending, accepted, rejected]}
    AccessRequest:
      type: object
      required: [id, username, status, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        status: {$ref: "#/components/schemas/AccessRequestStatus"}
        fields: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        decided_by: {type: string}
    AccessRequestList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AccessRequest"}}, next_cursor: {type: string}}
    AccessRequestCreate:
      type: object
      properties: {fields: {type: object, additionalProperties: true}}
    AccessRequestDecision:
      type: object
      required: [status]
      properties: {status: {type: string, enum: [accepted, rejected]}}

    # Uploads
    UploadFile:
      type: object
      required: [path, size, sha256]
      properties:
        path: {type: string}
        size: {type: integer, format: int64}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    UploadPlanRequest:
      type: object
      required: [files]
      properties:
        revision: {type: string}
        create_pr: {type: boolean}
        files: {type: array, items: {$ref: "#/components/schemas/UploadFile"}, maxItems: 1000}
    UploadPlanItem:
      type: object
      required: [path, action]
      properties:
        path: {type: string}
        action: {type: string, enum: [inline, exists, upload], description: "inline: send the content in the Commit. exists: the object is stored already. upload: upload it."}
        upload_id: {type: string, format: uuid}
        part_size: {type: integer, format: int64}
        part_urls: {type: array, items: {type: string}, description: Presigned or Hangar part URLs, in part order.}
        presigned: {type: boolean}
    UploadPlan:
      type: object
      required: [files]
      properties: {files: {type: array, items: {$ref: "#/components/schemas/UploadPlanItem"}}}
    UploadedPart:
      type: object
      required: [number, etag]
      properties:
        number: {type: integer}
        etag: {type: string}
        size: {type: integer, format: int64}
    UploadStatus:
      type: object
      required: [id, sha256, size, part_count, parts, state]
      properties:
        id: {type: string, format: uuid}
        sha256: {type: string}
        size: {type: integer, format: int64}
        part_size: {type: integer, format: int64}
        part_count: {type: integer}
        parts: {type: array, items: {$ref: "#/components/schemas/UploadedPart"}}
        state: {type: string, enum: [uploading, verified]}
        expires_at: {type: string, format: date-time}
    UploadComplete:
      type: object
      required: [parts]
      properties: {parts: {type: array, items: {$ref: "#/components/schemas/UploadedPart"}}}
    CommitOperation:
      type: object
      required: [op, path]
      properties:
        op: {type: string, enum: [add, add_lfs, delete, delete_folder, copy]}
        path: {type: string}
        content_base64: {type: string, description: For add.}
        sha256: {type: string, description: For add_lfs.}
        size: {type: integer, format: int64}
        src_path: {type: string, description: For copy.}
        src_revision: {type: string}
    CommitRequest:
      type: object
      required: [summary, operations]
      properties:
        summary: {type: string, minLength: 1}
        description: {type: string}
        branch: {type: string}
        parent_commit: {type: string}
        create_pr: {type: boolean}
        operations: {type: array, items: {$ref: "#/components/schemas/CommitOperation"}, minItems: 1}
    CommitResponse:
      type: object
      required: [sha, ref]
      properties:
        sha: {type: string}
        ref: {type: string}
        pull_request: {type: integer}
        no_op: {type: boolean}

    # Datasets
    DatasetSplit:
      type: object
      required: [split, status]
      properties:
        split: {type: string}
        status: {type: string, enum: [pending, ready, partial, failed]}
        num_rows: {type: integer, format: int64}
        num_bytes_source: {type: integer, format: int64}
        num_bytes_parquet: {type: integer, format: int64}
        error: {type: string}
        job_id: {type: string, format: uuid}
    DatasetConfig:
      type: object
      required: [config, default, splits]
      properties:
        config: {type: string}
        default: {type: boolean}
        splits: {type: array, items: {$ref: "#/components/schemas/DatasetSplit"}}
    DatasetConfigs:
      type: object
      required: [commit, from_card, configs]
      properties:
        commit: {type: string}
        from_card: {type: boolean}
        configs: {type: array, items: {$ref: "#/components/schemas/DatasetConfig"}}

    # Mirrors, Upstreams, Discover, Pulls
    Selection:
      type: object
      description: Files to Pull. Empty means every file.
      properties:
        include: {type: array, items: {type: string}}
        exclude: {type: array, items: {type: string}}
        paths: {type: array, items: {type: string}}
        quants: {type: array, items: {type: string}}
        configs: {type: array, items: {type: string}}
        splits: {type: array, items: {type: string}}
        parquet_only: {type: boolean}
    MirrorSummary:
      type: object
      required: [upstream, upstream_repo, status]
      properties:
        upstream: {type: string}
        upstream_repo: {type: string}
        upstream_url: {type: string}
        status: {type: string}
        last_synced_at: {type: string, format: date-time}
        update_available: {type: boolean}
    Mirror:
      allOf:
        - {$ref: "#/components/schemas/MirrorSummary"}
        - type: object
          required: [selection, track]
          properties:
            selection: {$ref: "#/components/schemas/Selection"}
            track: {type: boolean}
            track_ref: {type: string}
            schedule: {type: string}
            last_synced_commit: {type: string}
            last_error: {type: string}
    MirrorUpdate:
      type: object
      properties:
        selection: {$ref: "#/components/schemas/Selection"}
        track: {type: boolean}
        track_ref: {type: string}
        schedule: {type: string}
    Upstream:
      type: object
      required: [id, name, display_name, base_url, enabled]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        display_name: {type: string}
        base_url: {type: string}
        viewer_url: {type: string}
        enabled: {type: boolean}
        namespace_prefix: {type: string}
        source: {type: string, enum: [config, admin]}
        has_instance_token: {type: boolean}
    UpstreamList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Upstream"}}}
    UpstreamCreate:
      type: object
      required: [name, base_url]
      properties:
        name: {type: string}
        display_name: {type: string}
        base_url: {type: string}
        viewer_url: {type: string}
        enabled: {type: boolean}
        namespace_prefix: {type: string}
        instance_token: {type: string, format: password}
    UpstreamUpdate:
      type: object
      properties:
        display_name: {type: string}
        base_url: {type: string}
        viewer_url: {type: string}
        enabled: {type: boolean}
        namespace_prefix: {type: string}
        instance_token: {type: string, format: password, description: An empty string removes the token.}
    CheckResult:
      type: object
      required: [ok, message]
      properties:
        name: {type: string}
        ok: {type: boolean}
        message: {type: string}
        latency_ms: {type: integer}
    DiscoverItem:
      type: object
      required: [id, type, arsenal]
      properties:
        id: {type: string}
        type: {$ref: "#/components/schemas/RepoTypeSingular"}
        sha: {type: string}
        tags: {type: array, items: {type: string}}
        pipeline_tag: {type: string}
        library_name: {type: string}
        downloads: {type: integer, format: int64}
        likes: {type: integer, format: int64}
        last_modified: {type: string, format: date-time}
        gated: {type: string}
        private: {type: boolean}
        arsenal: {$ref: "#/components/schemas/ArsenalState"}
        local_sha: {type: string, description: Set when the Arsenal has an older Revision.}
    DiscoverList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/DiscoverItem"}}, next_cursor: {type: string}}
    DiscoverFile:
      type: object
      required: [path, size, lfs, present]
      properties:
        path: {type: string}
        size: {type: integer, format: int64}
        lfs: {type: boolean}
        present: {type: boolean}
    DiscoverDetail:
      allOf:
        - {$ref: "#/components/schemas/DiscoverItem"}
        - type: object
          required: [files, total_size, dependencies]
          properties:
            card: {type: string, description: The upstream README.md.}
            card_data: {type: object, additionalProperties: true}
            files: {type: array, items: {$ref: "#/components/schemas/DiscoverFile"}}
            quants: {type: array, items: {$ref: "#/components/schemas/QuantGroup"}}
            configs: {type: array, items: {$ref: "#/components/schemas/DatasetConfig"}}
            preview: {type: object, additionalProperties: true, description: First rows from the Upstream's Dataset Viewer.}
            dependencies: {type: array, items: {$ref: "#/components/schemas/Dependency"}}
            total_size: {type: integer, format: int64}
    PullCreate:
      type: object
      required: [upstream, repo, type]
      properties:
        upstream: {type: string}
        repo: {type: string}
        type: {$ref: "#/components/schemas/RepoTypeSingular"}
        revision: {type: string}
        selection: {$ref: "#/components/schemas/Selection"}
        track: {type: boolean}
        now: {type: boolean, description: Ignore pull windows, if the Instance allows it.}

    # Jobs
    JobStatus: {type: string, enum: [pending, running, succeeded, failed, cancelled]}
    FileProgress:
      type: object
      required: [path, bytes_done, bytes_total, status]
      properties:
        path: {type: string}
        bytes_done: {type: integer, format: int64}
        bytes_total: {type: integer, format: int64}
        status: {type: string}
        error: {type: string}
    JobProgress:
      type: object
      required: [bytes_done, bytes_total, files_done, files_total, rate]
      properties:
        bytes_done: {type: integer, format: int64}
        bytes_total: {type: integer, format: int64}
        files_done: {type: integer}
        files_total: {type: integer}
        rate: {type: number, description: Bytes per second.}
        eta_seconds: {type: integer}
        message: {type: string}
        files: {type: array, items: {$ref: "#/components/schemas/FileProgress"}}
    Job:
      type: object
      required: [id, kind, status, attempts, max_attempts, progress, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        status: {$ref: "#/components/schemas/JobStatus"}
        attempts: {type: integer}
        max_attempts: {type: integer}
        progress: {$ref: "#/components/schemas/JobProgress"}
        payload: {type: object, additionalProperties: true}
        result: {type: object, additionalProperties: true}
        error: {type: string}
        created_by: {type: string}
        parent_id: {type: string, format: uuid}
        run_after: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    JobList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Job"}}, next_cursor: {type: string}}

    # Namespaces
    Namespace:
      type: object
      required: [name, kind, display_name]
      properties:
        name: {type: string}
        kind: {type: string, enum: [user, org]}
        display_name: {type: string}
        description: {type: string}
        avatar_url: {type: string}
        reserved_mirror: {type: boolean}
        repo_count: {type: integer}
        member_count: {type: integer}
        created_at: {type: string, format: date-time}
    OrgCreate:
      type: object
      required: [name]
      properties:
        name: {type: string}
        display_name: {type: string}
        description: {type: string}
    OrgUpdate:
      type: object
      properties:
        display_name: {type: string}
        description: {type: string}
    Member:
      type: object
      required: [username, role, source]
      properties:
        username: {type: string}
        display_name: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        source: {type: string, enum: [manual, oidc]}
    MemberList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Member"}}}
    MemberSet:
      type: object
      required: [role]
      properties: {role: {$ref: "#/components/schemas/Role"}}

    # Collections
    CollectionItem:
      type: object
      required: [id, type, item_id, position]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [model, dataset, collection]}
        item_id: {type: string}
        position: {type: integer}
        note: {type: string}
        repo: {$ref: "#/components/schemas/Repo"}
    Collection:
      type: object
      required: [namespace, slug, title, visibility, items, updated_at]
      properties:
        namespace: {type: string}
        slug: {type: string}
        title: {type: string}
        description: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
        theme: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/CollectionItem"}}
        updated_at: {type: string, format: date-time}
    CollectionList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Collection"}}}
    CollectionCreate:
      type: object
      required: [namespace, title]
      properties:
        namespace: {type: string}
        title: {type: string}
        description: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
    CollectionUpdate:
      type: object
      properties:
        title: {type: string}
        description: {type: string}
        visibility: {$ref: "#/components/schemas/Visibility"}
        theme: {type: string}
    CollectionItemCreate:
      type: object
      required: [type, item_id]
      properties:
        type: {type: string, enum: [model, dataset, collection]}
        item_id: {type: string}
        note: {type: string}
    CollectionItemUpdate:
      type: object
      properties:
        note: {type: string}
        position: {type: integer, minimum: 0}

    # Community
    DiscussionEvent:
      type: object
      required: [id, type, author, created_at]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [comment, status-change, title-change, commit]}
        author: {type: string}
        body: {type: string}
        data: {type: object, additionalProperties: true}
        hidden: {type: boolean}
        created_at: {type: string, format: date-time}
    Discussion:
      type: object
      required: [num, kind, title, status, author, created_at]
      properties:
        num: {type: integer}
        kind: {type: string, enum: [discussion, pull_request]}
        title: {type: string}
        status: {type: string, enum: [draft, open, closed, merged]}
        author: {type: string}
        pr_ref: {type: string}
        pr_base: {type: string}
        events: {type: array, items: {$ref: "#/components/schemas/DiscussionEvent"}}
        changes: {type: array, items: {$ref: "#/components/schemas/FileChange"}}
        created_at: {type: string, format: date-time}
    DiscussionList:
      type: object
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Discussion"}}
        total: {type: integer}
        next_cursor: {type: string}
    DiscussionCreate:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
        pull_request: {type: boolean}
        base: {type: string}
    DiscussionUpdate:
      type: object
      properties:
        title: {type: string}
        status: {type: string, enum: [open, closed]}
        comment: {type: string}
    CommentCreate:
      type: object
      required: [body]
      properties: {body: {type: string, minLength: 1}}
    MergeRequest:
      type: object
      properties: {comment: {type: string}}

    # Webhooks
    Webhook:
      type: object
      required: [id, url, events, enabled, created_at]
      properties:
        id: {type: string, format: uuid}
        namespace: {type: string}
        repo: {type: string, description: type/ns/name}
        url: {type: string}
        events: {type: array, items: {type: string}}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        last_delivery: {$ref: "#/components/schemas/WebhookDelivery"}
    WebhookList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Webhook"}}}
    WebhookCreate:
      type: object
      required: [url, events, secret]
      properties:
        namespace: {type: string}
        repo: {type: string}
        url: {type: string}
        events: {type: array, items: {type: string}, minItems: 1}
        secret: {type: string, format: password}
        enabled: {type: boolean}
    WebhookUpdate:
      type: object
      properties:
        url: {type: string}
        events: {type: array, items: {type: string}}
        secret: {type: string, format: password}
        enabled: {type: boolean}
    WebhookDelivery:
      type: object
      required: [id, event, attempt, created_at]
      properties:
        id: {type: string, format: uuid}
        event: {type: string}
        status_code: {type: integer}
        attempt: {type: integer}
        duration_ms: {type: integer}
        error: {type: string}
        next_attempt_at: {type: string, format: date-time}
        delivered_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        payload: {type: string}
    WebhookDeliveryList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/WebhookDelivery"}}, next_cursor: {type: string}}

    # Admin
    AdminUser:
      type: object
      required: [id, username, is_admin, disabled, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        email: {type: string}
        is_admin: {type: boolean}
        disabled: {type: boolean}
        oidc_providers: {type: array, items: {type: string}}
        last_login_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    AdminUserList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AdminUser"}}, next_cursor: {type: string}}
    AdminUserCreate:
      type: object
      required: [username]
      properties:
        username: {type: string}
        email: {type: string}
        display_name: {type: string}
        password: {type: string, format: password}
        is_admin: {type: boolean}
    AdminUserUpdate:
      type: object
      properties:
        disabled: {type: boolean}
        is_admin: {type: boolean}
        email: {type: string}
        display_name: {type: string}
    InviteCreate:
      type: object
      properties:
        email: {type: string}
        org: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        is_admin: {type: boolean}
    Link:
      type: object
      required: [url, expires_at]
      properties:
        url: {type: string}
        expires_at: {type: string, format: date-time}
    InstanceSettings:
      type: object
      properties:
        anonymous_read: {type: boolean}
        registration: {type: string, enum: [open, invite, closed]}
        local_login: {type: boolean}
        ui_external_images: {type: boolean}
        scan_block_unsafe_downloads: {type: boolean}
        webhooks_allow_private_targets: {type: boolean}
        pull_bandwidth_limit: {type: integer, format: int64}
        pull_concurrency: {type: integer}
        pull_windows: {type: array, items: {type: string}}
        pull_allow_override_windows: {type: boolean}
        pull_through_enabled: {type: boolean}
        pull_through_allow: {type: array, items: {type: string}}
        pull_through_min_role: {type: string, enum: [anonymous, user]}
        oidc_providers: {type: array, readOnly: true, items: {type: object, properties: {id: {type: string}, name: {type: string}, issuer: {type: string}}}}
    NamespaceUsage:
      type: object
      required: [namespace, lfs_bytes, git_bytes, repo_count]
      properties:
        namespace: {type: string}
        lfs_bytes: {type: integer, format: int64}
        git_bytes: {type: integer, format: int64}
        repo_count: {type: integer}
        quota_bytes: {type: integer, format: int64}
    StorageUsage:
      type: object
      required: [total_lfs_bytes, total_git_bytes, xet_cache_bytes, namespaces]
      properties:
        total_lfs_bytes: {type: integer, format: int64}
        total_git_bytes: {type: integer, format: int64}
        xet_cache_bytes: {type: integer, format: int64, description: The Xet upload cache.}
        namespaces: {type: array, items: {$ref: "#/components/schemas/NamespaceUsage"}}
        last_gc_at: {type: string, format: date-time}
    Quota:
      type: object
      required: [bytes_limit]
      properties: {bytes_limit: {type: integer, format: int64, minimum: 0, description: 0 removes the quota.}}
    AuditEvent:
      type: object
      required: [id, action, created_at]
      properties:
        id: {type: string}
        action: {type: string}
        actor: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        ip: {type: string}
        user_agent: {type: string}
        data: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    AuditEventList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}, next_cursor: {type: string}}
    SystemInfo:
      type: object
      required: [version, role, database, blob_store, telemetry, checks]
      properties:
        version: {type: string}
        commit: {type: string}
        role: {type: string}
        database: {type: object, required: [driver, schema_version], properties: {driver: {type: string}, schema_version: {type: string}}}
        blob_store: {type: object, required: [backend], properties: {backend: {type: string}, download_mode: {type: string}}}
        telemetry: {type: object, additionalProperties: {type: string}, description: Exporter per signal.}
        checks: {type: array, items: {$ref: "#/components/schemas/CheckResult"}}
