openapi: 3.1.0
info:
  title: Hangar native API
  version: 1.0.0
  summary: The API behind Hangar's web UI, CLI and automation.
  description: |
    The native API serves the web UI, the `hangar` CLI and automation. It is
    separate from the Hugging Face Hub API that Hangar also serves.

    Conventions:

    - JSON in and out, `snake_case` field names, RFC 3339 UTC times, sizes in
      bytes as integers.
    - Errors are RFC 9457 problem details (`application/problem+json`).
    - Lists use cursor pagination: `?cursor=&limit=` (default 50, maximum
      500), answered with `{"items": [...], "next_cursor": "..."}`.
    - Authenticate with the `hangar_session` cookie plus the `X-CSRF-Token`
      header on state-changing calls, or with `Authorization: Bearer <token>`.
    - Revisions and file paths in paths are percent-encoded, with `/` as `%2F`
      (for example `refs%2Fpr%2F1`).
  license:
    name: Elastic License 2.0
    identifier: Elastic-2.0
servers:
  - url: /api/hangar/v1
security:
  - session: []
  - bearer: []
tags:
  - {name: session, description: Signing in and out, and the current user.}
  - {name: tokens, description: API and git Tokens.}
  - {name: keys, description: Ollama keys and Upstream tokens.}
  - {name: search, description: Global search.}
  - {name: repos, description: Repos, files, Commits and settings.}
  - {name: uploads, description: Uploads and Commits from the browser and CLI.}
  - {name: datasets, description: Dataset Configs, Splits and Parquet export status.}
  - {name: mirrors, description: Mirror settings and syncs.}
  - {name: discover, description: Searching Upstreams and starting Pulls.}
  - {name: jobs, description: Background Jobs.}
  - {name: namespaces, description: Users, Organisations and Members.}
  - {name: collections, description: Collections.}
  - {name: community, description: Discussions and pull requests.}
  - {name: webhooks, description: Webhooks and deliveries.}
  - {name: admin, description: Instance administration.}

paths:
  # Session -------------------------------------------------------------------
  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: Get the signed-in user
      responses:
        "200": {description: The signed-in user., content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /auth/login:
    post:
      tags: [session]
      operationId: login
      summary: Sign in with a username and password
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}
      responses:
        "200":
          description: Signed in. The response sets the session cookie.
          headers:
            Set-Cookie: {schema: {type: string}, description: The `hangar_session` cookie.}
          content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}
        default: {$ref: "#/components/responses/Problem"}
  /auth/logout:
    post:
      tags: [session]
      operationId: logout
      summary: Sign out
      responses:
        "204": {description: Signed out.}
        default: {$ref: "#/components/responses/Problem"}
  /auth/providers:
    get:
      tags: [session]
      operationId: listAuthProviders
      summary: List sign-in methods
      security: []
      responses:
        "200": {description: Sign-in methods., content: {application/json: {schema: {$ref: "#/components/schemas/AuthProviders"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /me/sessions:
    get:
      tags: [session]
      operationId: listMySessions
      summary: List my sessions
      responses:
        "200": {description: Sessions., content: {application/json: {schema: {$ref: "#/components/schemas/SessionList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /me/sessions/{id}:
    delete:
      tags: [session]
      operationId: revokeMySession
      summary: Revoke a session
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: Revoked.}
        default: {$ref: "#/components/responses/Problem"}

  # Tokens and keys -------------------------------------------------------------
  /me/tokens:
    get:
      tags: [tokens]
      operationId: listMyTokens
      summary: List my Tokens
      responses:
        "200": {description: Tokens., content: {application/json: {schema: {$ref: "#/components/schemas/TokenList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [tokens]
      operationId: createMyToken
      summary: Create a Token
      description: The secret is returned once and never again.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TokenCreate"}}}
      responses:
        "201": {description: The Token and its secret., content: {application/json: {schema: {$ref: "#/components/schemas/TokenCreated"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /me/tokens/{id}:
    delete:
      tags: [tokens]
      operationId: revokeMyToken
      summary: Revoke a Token
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: Revoked.}
        default: {$ref: "#/components/responses/Problem"}
  /me/device:
    post:
      tags: [tokens]
      operationId: decideDeviceLogin
      summary: Approve or deny a device-code login
      description: Answers the code that `hf auth login` shows in a browser-based login.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/DeviceDecision"}}}
      responses:
        "204": {description: Recorded.}
        default: {$ref: "#/components/responses/Problem"}
  /me/ollama-keys:
    get:
      tags: [keys]
      operationId: listMyOllamaKeys
      summary: List my Ollama keys
      responses:
        "200": {description: Keys., content: {application/json: {schema: {$ref: "#/components/schemas/OllamaKeyList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [keys]
      operationId: addMyOllamaKey
      summary: Register an Ollama public key
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/OllamaKeyCreate"}}}
      responses:
        "201": {description: Registered., content: {application/json: {schema: {$ref: "#/components/schemas/OllamaKey"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /me/ollama-keys/{id}:
    delete:
      tags: [keys]
      operationId: deleteMyOllamaKey
      summary: Remove an Ollama key
      parameters: [{$ref: "#/components/parameters/ID"}]
      responses:
        "204": {description: Removed.}
        default: {$ref: "#/components/responses/Problem"}
  /me/upstream-tokens/{upstream}:
    parameters: [{name: upstream, in: path, required: true, description: Upstream name, such as huggingface., schema: {type: string}}]
    get:
      tags: [keys]
      operationId: getMyUpstreamToken
      summary: Say whether I saved a token for an Upstream
      description: The token itself is never returned.
      responses:
        "200": {description: Status., content: {application/json: {schema: {$ref: "#/components/schemas/UpstreamTokenStatus"}}}}
        default: {$ref: "#/components/responses/Problem"}
    put:
      tags: [keys]
      operationId: setMyUpstreamToken
      summary: Save my token for an Upstream
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UpstreamTokenSet"}}}
      responses:
        "200": {description: Saved., content: {application/json: {schema: {$ref: "#/components/schemas/UpstreamTokenStatus"}}}}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [keys]
      operationId: deleteMyUpstreamToken
      summary: Remove my token for an Upstream
      responses:
        "204": {description: Removed.}
        default: {$ref: "#/components/responses/Problem"}

  # Search and Arsenal ------------------------------------------------------------
  /search:
    get:
      tags: [search]
      operationId: search
      summary: Search Repos, Namespaces and Collections
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: types, in: query, description: Comma-separated result types., schema: {type: array, items: {type: string, enum: [repos, namespaces, collections]}}, style: form, explode: false}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Results., content: {application/json: {schema: {$ref: "#/components/schemas/SearchResults"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos:
    get:
      tags: [repos]
      operationId: listRepos
      summary: List the Arsenal
      description: Repos the caller can see, with filters and facet counts (BROWSE-1, DATA-11).
      parameters:
        - {name: type, in: query, schema: {$ref: "#/components/schemas/RepoTypePlural"}}
        - {name: q, in: query, schema: {type: string}}
        - {name: ns, in: query, schema: {type: string}}
        - {name: format, in: query, schema: {type: array, items: {type: string}}, style: form, explode: false}
        - {name: task, in: query, schema: {type: string}}
        - {name: library, in: query, schema: {type: string}}
        - {name: quant, in: query, schema: {type: string}}
        - {name: params_min, in: query, schema: {type: integer, format: int64}}
        - {name: params_max, in: query, schema: {type: integer, format: int64}}
        - {name: context_min, in: query, schema: {type: integer, format: int64}}
        - {name: size_max, in: query, schema: {type: integer, format: int64}}
        - {name: licence, in: query, schema: {type: string}}
        - {name: mirror, in: query, schema: {type: boolean}}
        - {name: modality, in: query, schema: {type: string}}
        - {name: language, in: query, schema: {type: string}}
        - {name: size_category, in: query, schema: {type: string}}
        - {name: sort, in: query, schema: {type: string, enum: [updated, name, size, parameters, downloads, likes]}}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: A page of Repos., content: {application/json: {schema: {$ref: "#/components/schemas/RepoList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [repos]
      operationId: createRepo
      summary: Create a Repo
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RepoCreate"}}}
      responses:
        "201": {description: Created., content: {application/json: {schema: {$ref: "#/components/schemas/Repo"}}}}
        default: {$ref: "#/components/responses/Problem"}

  # Repos -----------------------------------------------------------------------
  /repos/{type}/{ns}/{name}:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: getRepo
      summary: Get a Repo
      responses:
        "200": {description: The Repo., content: {application/json: {schema: {$ref: "#/components/schemas/Repo"}}}}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [repos]
      operationId: updateRepo
      summary: Change Repo settings
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RepoUpdate"}}}
      responses:
        "200": {description: Updated., content: {application/json: {schema: {$ref: "#/components/schemas/Repo"}}}}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [repos]
      operationId: deleteRepo
      summary: Delete a Repo
      description: Soft delete; the Repo can be restored within `repos.restore_window`.
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/restore:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    post:
      tags: [repos]
      operationId: restoreRepo
      summary: Restore a deleted Repo
      responses:
        "200": {description: Restored., content: {application/json: {schema: {$ref: "#/components/schemas/Repo"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/rename:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    post:
      tags: [repos]
      operationId: renameRepo
      summary: Rename a Repo
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RenameRequest"}}}
      responses:
        "200": {description: Renamed., content: {application/json: {schema: {$ref: "#/components/schemas/Repo"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/transfer:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    post:
      tags: [repos]
      operationId: transferRepo
      summary: Move a Repo to another Namespace
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TransferRequest"}}}
      responses:
        "200": {description: Moved., content: {application/json: {schema: {$ref: "#/components/schemas/Repo"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/refs:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: listRepoRefs
      summary: List branches, tags, pull request refs and converts
      responses:
        "200": {description: Refs., content: {application/json: {schema: {$ref: "#/components/schemas/Refs"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/commits:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: listCommits
      summary: List Commits
      parameters:
        - {$ref: "#/components/parameters/RevQuery"}
        - {name: path, in: query, description: Only Commits that change this path., schema: {type: string}}
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Commits, newest first., content: {application/json: {schema: {$ref: "#/components/schemas/CommitList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [uploads]
      operationId: createCommit
      summary: Make a Commit
      description: Adds, deletes and copies files, after any LFS uploads have completed.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CommitRequest"}}}
      responses:
        "201": {description: Committed., content: {application/json: {schema: {$ref: "#/components/schemas/CommitResponse"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/commits/{sha}:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}, {$ref: "#/components/parameters/SHA"}]
    get:
      tags: [repos]
      operationId: getCommit
      summary: Get a Commit with its diff summary
      responses:
        "200": {description: The Commit., content: {application/json: {schema: {$ref: "#/components/schemas/CommitDetail"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/commits/{sha}/diff:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}, {$ref: "#/components/parameters/SHA"}]
    get:
      tags: [repos]
      operationId: getCommitFileDiff
      summary: Get the diff of one file in a Commit
      parameters: [{name: path, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: The diff., content: {application/json: {schema: {$ref: "#/components/schemas/FileDiff"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/tree/{rev}:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}, {$ref: "#/components/parameters/Rev"}]
    get:
      tags: [repos]
      operationId: getTreeRoot
      summary: List the root directory at a Revision
      parameters: [{$ref: "#/components/parameters/Recursive"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Entries., content: {application/json: {schema: {$ref: "#/components/schemas/TreeListing"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/tree/{rev}/{path}:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}, {$ref: "#/components/parameters/Rev"}, {$ref: "#/components/parameters/FilePath"}]
    get:
      tags: [repos]
      operationId: getTree
      summary: List a directory, or describe a file, at a Revision
      description: Entries include presence (for Partial mirrors), scan status and the last Commit.
      parameters: [{$ref: "#/components/parameters/Recursive"}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Entries., content: {application/json: {schema: {$ref: "#/components/schemas/TreeListing"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/metadata:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: getRepoMetadata
      summary: Get the index of a Revision
      parameters: [{$ref: "#/components/parameters/RevQuery"}]
      responses:
        "200": {description: Index results, or status pending while indexing., content: {application/json: {schema: {$ref: "#/components/schemas/RepoMetadata"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/files/{rev}/{path}/header:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}, {$ref: "#/components/parameters/Rev"}, {$ref: "#/components/parameters/FilePath"}]
    get:
      tags: [repos]
      operationId: getFileHeader
      summary: Get a safetensors or GGUF header
      description: Read with ranged reads, so the whole file is never downloaded.
      responses:
        "200": {description: The header as JSON., content: {application/json: {schema: {$ref: "#/components/schemas/FileHeader"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/quants:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: listQuants
      summary: List GGUF quantisation groups
      parameters: [{$ref: "#/components/parameters/RevQuery"}]
      responses:
        "200": {description: Quant groups., content: {application/json: {schema: {$ref: "#/components/schemas/QuantList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/dependencies:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: getDependencies
      summary: Get Dependencies both ways
      responses:
        "200": {description: What the Repo needs and what needs it., content: {application/json: {schema: {$ref: "#/components/schemas/Dependencies"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/like:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    post:
      tags: [repos]
      operationId: likeRepo
      summary: Like a Repo
      responses:
        "200": {description: Liked., content: {application/json: {schema: {$ref: "#/components/schemas/LikeStatus"}}}}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [repos]
      operationId: unlikeRepo
      summary: Remove a like
      responses:
        "200": {description: Unliked., content: {application/json: {schema: {$ref: "#/components/schemas/LikeStatus"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/stats:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: getRepoStats
      summary: Get downloads by day
      parameters: [{name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365, default: 30}}]
      responses:
        "200": {description: Daily downloads., content: {application/json: {schema: {$ref: "#/components/schemas/RepoStats"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/collaborators:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: listCollaborators
      summary: List collaborators
      responses:
        "200": {description: Collaborators., content: {application/json: {schema: {$ref: "#/components/schemas/CollaboratorList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    put:
      tags: [repos]
      operationId: setCollaborators
      summary: Replace collaborators
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CollaboratorList"}}}
      responses:
        "200": {description: Collaborators., content: {application/json: {schema: {$ref: "#/components/schemas/CollaboratorList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/access-requests:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    get:
      tags: [repos]
      operationId: listAccessRequests
      summary: List access requests of a gated Repo
      parameters: [{name: status, in: query, schema: {$ref: "#/components/schemas/AccessRequestStatus"}}, {$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Requests., content: {application/json: {schema: {$ref: "#/components/schemas/AccessRequestList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [repos]
      operationId: requestAccess
      summary: Ask for access to a gated Repo
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AccessRequestCreate"}}}
      responses:
        "201": {description: Requested., content: {application/json: {schema: {$ref: "#/components/schemas/AccessRequest"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/access-requests/{id}:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}, {$ref: "#/components/parameters/ID"}]
    patch:
      tags: [repos]
      operationId: decideAccessRequest
      summary: Accept or reject an access request
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AccessRequestDecision"}}}
      responses:
        "200": {description: Decided., content: {application/json: {schema: {$ref: "#/components/schemas/AccessRequest"}}}}
        default: {$ref: "#/components/responses/Problem"}

  # Uploads ---------------------------------------------------------------------
  /repos/{type}/{ns}/{name}/uploads:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}]
    post:
      tags: [uploads]
      operationId: planUploads
      summary: Plan uploads for a set of files
      description: For each file, says whether to send it inline in the Commit, skip it because the object exists, or upload it, with part URLs.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/UploadPlanRequest"}}}
      responses:
        "200": {description: The plan., content: {application/json: {schema: {$ref: "#/components/schemas/UploadPlan"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/uploads/{id}:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}, {$ref: "#/components/parameters/ID"}]
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Get an upload's parts, to resume it
      responses:
        "200": {description: Upload state., content: {application/json: {schema: {$ref: "#/components/schemas/UploadStatus"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /repos/{type}/{ns}/{name}/uploads/{id}/parts/{n}:
    parameters: [{$ref: "#/components/parameters/RepoType"}, {$ref: "#/components/parameters/Ns"}, {$ref: "#/components/parameters/Name"}, {$ref: "#/components/parameters/ID"}, {name: n, in: path, required: true, schema: {type: integer, minimum: 1, maximum: 10000}}]
    put:
      tags: [uploads]
      operationId: putUploadPart
      summary: Upload a part through Hangar
      description: Used when the Blob store cannot presign part URLs.
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        "200": {description: Stored., headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: "#/components/schemas/UploadedPart"}}}}
