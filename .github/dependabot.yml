# Keeps dependencies current (docs/spec/12-packaging-and-release.md). Each
# update waits 14 days after its release, the same rule as the action pins.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message: {prefix: deps}
  - package-ecosystem: npm
    directory: /ui
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major in ui/.nvmrc and CI; move both
      # together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message: {prefix: deps}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      actions:
        patterns: ["*"]
    commit-message: {prefix: deps}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    commit-message: {prefix: deps}
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    commit-message: {prefix: deps}
  - package-ecosystem: uv
    directory: /compat
    schedule: {interval: weekly}
    cooldown: {default-days: 14}
    groups:
      compat:
        patterns: ["*"]
    commit-message: {prefix: deps}
  - package-ecosystem: pip
    directory: /docs
    schedule: {interval: monthly}
    cooldown: {default-days: 14}
    commit-message: {prefix: deps}
