name: Question
description: Ask how to set up or use Hangar.
labels: [question]
body:
  - type: markdown
    attributes:
      value: The [documentation](https://hangar.page/) and [Troubleshooting](https://hangar.page/latest/operate/troubleshooting/) answer many questions. If something doesn't work as they describe, use the bug report form instead.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried so far.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Hangar version
      description: The output of `hangar version`, or the image tag or chart version you run.
  - type: dropdown
    id: setup
    attributes:
      label: How you run Hangar
      options: [Docker, Docker Compose, Helm, Binary, Not running it yet, Other]
