name: Feature request
description: Suggest something Hangar should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What you suggest
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you have considered
