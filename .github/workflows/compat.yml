name: Compatibility

on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  compat:
    name: Client suites (Go and pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: compat/.fixtures
          key: compat-fixtures-${{ hashFiles('compat/fixtures.json') }}
      - name: Download fixtures
        run: make fixtures
      - name: Build hangar
        run: go build -o "$RUNNER_TEMP/hangar" ./cmd/hangar && echo "HANGAR_BINARY=$RUNNER_TEMP/hangar" >> "$GITHUB_ENV"
      # compat/ollama runs the pinned Ollama image against the binary above.
      - name: Pull the pinned Ollama image
        run: docker pull "ollama/ollama:$(sed -n 's/^const TestedOllamaVersion = "\(.*\)"$/\1/p' internal/ollama/*.go)"
      - name: Go and pytest suites, including git, Ollama, LM Studio and the Hub clients
        run: make test-compat

  # The Hub client matrix from compat/hf/README.md ("Client matrix"): the
  # latest huggingface_hub and the oldest one the latest transformers
  # supports, with and without hf_xet, on Python 3.10 and the latest Python.
  hub-matrix:
    name: Hub clients (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cell: [latest, latest-python, floor, without-xet, diffusers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Choose the multipart test size
        run: |
          # 200 MB, nightly too. These cells run against repotest.Fake, which
          # keeps every upload in memory, so the nightly 6 GiB file ran the
          # runner out of memory and stopped it. The binary cells below
          # upload 6 GiB nightly to a real Blob store (13-testing.md).
          echo "HANGAR_HF_MULTIPART_FILE_SIZE=200000000" >> "$GITHUB_ENV"
      - name: Run the cell
        env:
          CELL: ${{ matrix.cell }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$CELL" in
            latest)
              uv run --frozen --project compat python -m pytest compat/hf ;;
            latest-python)
              UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-latest" \
                uv run --frozen --project compat --python 3.14 python -m pytest compat/hf ;;
            floor)
              UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-floor" \
                uv run --frozen --project compat --python 3.10 --with huggingface_hub==1.31.0 python -m pytest compat/hf ;;
            without-xet)
              venv="$RUNNER_TEMP/venv-noxet"
              uv venv --python 3.11 "$venv"
              uv export --frozen --project compat --no-hashes --no-emit-project | grep -v '^hf-xet' > "$RUNNER_TEMP/reqs.txt"
              VIRTUAL_ENV="$venv" uv pip install --no-deps -r "$RUNNER_TEMP/reqs.txt"
              PATH="$venv/bin:$PATH" HANGAR_HF_WITHOUT_XET=1 "$venv/bin/python" -m pytest compat/hf ;;
            diffusers)
              if [ "$EVENT" != "schedule" ]; then echo "The diffusers cell runs nightly."; exit 0; fi
              UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-diffusers" \
                uv run --frozen --project compat --with diffusers==0.41.0 --with huggingface_hub==1.33.0 python -m pytest compat/hf ;;
          esac

  # The same suite against the real hangar binary instead of the Go test
  # server over fakes: W3's git-lfs batch and multipart endpoints, W11's Xet
  # CAS with HANGAR_HF_XET_UPLOADS=1 (the Xet uploads cell), on SQLite and
  # Postgres. conftest.py creates the users, Tokens and Organisation.
  hub-binary:
    name: Hub clients on the binary (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: sqlite, db: sqlite, xet: "0"}
          - {cell: sqlite-xet, db: sqlite, xet: "1"}
          - {cell: postgres, db: postgres, xet: "0"}
          - {cell: postgres-xet, db: postgres, xet: "1"}
          - {cell: floor-xet, db: sqlite, xet: "1", hub: "1.31.0"}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: hangar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hangar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANGAR_HF_INSTANCE: binary
      HANGAR_HF_DB: ${{ matrix.db }}
      HANGAR_HF_DATABASE_DSN: postgres://hangar:hangar@localhost:5432/hangar?sslmode=disable
      HANGAR_HF_XET_UPLOADS: ${{ matrix.xet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build hangar
        run: go build -o "$RUNNER_TEMP/hangar" ./cmd/hangar && echo "HANGAR_BINARY=$RUNNER_TEMP/hangar" >> "$GITHUB_ENV"
      - name: Choose the multipart test size
        run: |
          # 200 MB on pull requests; a 6 GiB file nightly and on manual runs
          # (13-testing.md).
          if [ "${{ github.event_name }}" = "pull_request" ]; then size=200000000; else size=6442450944; fi
          echo "HANGAR_HF_MULTIPART_FILE_SIZE=$size" >> "$GITHUB_ENV"
      - name: Run the cell
        env:
          HUB: ${{ matrix.hub }}
        run: |
          if [ -n "$HUB" ]; then
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/venv-floor" \
              uv run --frozen --project compat --python 3.10 --with "huggingface_hub==$HUB" python -m pytest compat/hf
          else
            uv run --frozen --project compat python -m pytest compat/hf
          fi

  # git 2.39 (Debian 12) as well as the latest git in the job above (13-testing.md).
  git-239:
    name: git 2.39 (Debian 12)
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Install git, git-lfs and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs ca-certificates curl tar gcc libc6-dev
          git --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # TestLFSMultipartTransfer runs the hf CLI from the compat lock as the
      # git-lfs multipart transfer agent, found with `uv run --project compat`.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the hf CLI from the compat lock
        run: uv sync --frozen --project compat
      - name: compat/git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Real git and git-lfs subprocesses: allow more than go test's
          # 10-minute default on a slow runner (Makefile, COMPAT_TIMEOUT).
          go test -count=1 -timeout 30m -tags compat ./compat/git/

  # Xet uploads (UP-7): the oldest hf_xet huggingface_hub 2.2.0 accepts and
  # the latest 1.x, each on the fakes and on the real Repo service, plus the
  # 14 MiB reference xorb (15-build-plan.md, W11).
  xet:
    name: Xet uploads (hf_xet ${{ matrix.hf_xet }}, ${{ matrix.backend }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        hf_xet: ["1.6.0", "1.7.0"]
        backend: [fakes, real]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: compat/.fixtures
          key: compat-fixtures-xet-${{ hashFiles('compat/fixtures.json') }}
      - name: Reference xorb
        if: matrix.backend == 'fakes' && matrix.hf_xet == '1.7.0'
        run: go test -count=1 -tags xetref -run TestReferenceXorb ./internal/xet
      - name: compat/xet
        working-directory: compat
        env:
          HF_XET_VERSION: ${{ matrix.hf_xet }}
          BACKEND: ${{ matrix.backend }}
        run: |
          if [ "$BACKEND" = real ]; then export HANGAR_XET_GO_TAGS=xetreal; fi
          uv run --no-project --python 3.11 --with pytest==9.1.1 --with requests==2.34.2 \
            --with huggingface_hub==2.2.0 --with "hf-xet==$HF_XET_VERSION" pytest xet -p no:cacheprovider

  compose:
    name: Compose example (${{ matrix.example }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [quickstart, postgres-minio, scale, oidc-keycloak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hangar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start, smoke test and remove
        env:
          HANGAR_IMAGE: hangar:ci
          HANGAR_PORT: "8080"
        run: |
          # Pulls from huggingface.co run nightly; pull requests stay offline.
          if [ "${{ github.event_name }}" = "schedule" ]; then skip=(); else skip=(--skip pull); fi
          ./scripts/compose-smoke.sh "${{ matrix.example }}" "${skip[@]}"

  helm:
    name: Helm chart on kind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hangar:ci
          cache-from: type=gha
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: hangar
      - name: Load the image
        run: kind load docker-image hangar:ci --name hangar
      - name: ct lint and ct install (runs helm test)
        run: |
          # Offline renders cannot keep generated secrets, so the chart
          # refuses to generate them there; ct install and the cluster tests
          # below cover generation.
          ct lint --charts deploy/helm/hangar --validate-maintainers=false --check-version-increment=false \
            --helm-lint-extra-args "--set=generateSecrets=false"
          ct install --charts deploy/helm/hangar \
            --helm-extra-set-args "--set=image.repository=hangar --set=image.tag=ci --set=image.pullPolicy=Never"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cluster tests (generated secrets, a GitOps-style install with Postgres and MinIO)
        env:
          KIND_CLUSTER: hangar
          KIND_CLUSTER_EXISTS: "1"
        run: ./scripts/kind-chart-test.sh hangar:ci
      - name: Smoke test through a port-forward
        run: |
          helm install smoke deploy/helm/hangar --namespace smoke --create-namespace \
            -f deploy/helm/hangar/ci/default-values.yaml --set publicURL=http://localhost:18080 \
            --set image.repository=hangar --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 5m
          kubectl --namespace smoke port-forward svc/smoke-hangar 18080:8080 &
          password="$(kubectl --namespace smoke get secret smoke-hangar-generated \
            -o jsonpath='{.data.HANGAR_SECURITY_BOOTSTRAP_ADMIN_PASSWORD}' | base64 -d)"
          if [ "${{ github.event_name }}" = "schedule" ]; then skip=(); else skip=(--skip pull); fi
          HANGAR_SMOKE_PASSWORD="$password" ./scripts/smoke.sh "${skip[@]}" http://localhost:18080

  e2e:
    name: UI end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: make build PNPM=pnpm
      - name: Start hangar, and a second Instance as its Upstream
        run: |
          # start <data directory> <port> <bootstrap admin password>
          start() {
            ./bin/hangar server --public-url "http://localhost:$2" --listen ":$2" --set server.data_dir="$1" \
              --set database.dsn="$1/hangar.db" --set storage.fs.path="$1/blobs" \
              --set git.cache_dir="$1/git" --set security.bootstrap_admin.password="$3" &
          }
          password="$(openssl rand -hex 16)"
          upstream_password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "::add-mask::$upstream_password"
          {
            echo "HANGAR_E2E_ADMIN_PASSWORD=$password"
            echo "HANGAR_E2E_UPSTREAM_URL=http://localhost:8081"
            echo "HANGAR_E2E_UPSTREAM_ADMIN_PASSWORD=$upstream_password"
          } >> "$GITHUB_ENV"
          start "$RUNNER_TEMP/hangar" 8080 "$password"
          start "$RUNNER_TEMP/upstream" 8081 "$upstream_password"
          for port in 8080 8081; do
            for _ in $(seq 1 30); do ./bin/hangar healthcheck --listen ":$port" && break; sleep 1; done
          done
      - working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Flows against the mock server
        working-directory: ui
        run: pnpm exec playwright test
      - name: Flows and pages against the real Instance, seeded through its API
        working-directory: ui
        env:
          HANGAR_URL: http://localhost:8080
        run: pnpm exec playwright test -c playwright.real.config.ts
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/playwright-report-real
