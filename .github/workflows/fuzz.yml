name: Fuzz

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per fuzz target
        default: 10m

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run every fuzz target
        # The input reaches the script through the environment, never the
        # script text, and must be a Go duration or an iteration count.
        env:
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: |
          if [[ ! "$FUZZTIME" =~ ^([0-9]+(ms|s|m|h))+$ && ! "$FUZZTIME" =~ ^[0-9]+x$ ]]; then
            echo "::error::fuzztime must be a duration such as 10m or 1h30m, or a count such as 1000x"
            exit 1
          fi
          ./scripts/fuzz.sh "$FUZZTIME"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"
