name: Release

# Builds and publishes a release (docs/spec/12-packaging-and-release.md):
# binaries with GoReleaser, the multi-arch image (scanned with Trivy, then
# signed with cosign keyless, with an SPDX SBOM attestation and SLSA
# provenance), the Helm chart as an OCI artefact, the documentation site,
# and the demo branch that Cloudflare deploys the mock demo from.
#
# The image is pushed by digest only, with no tag, and scanned by that
# digest. Only an image without critical CVEs that have a fix is signed,
# attested and tagged, and the chart, docs and demo jobs wait for it.
#
# The tag starts it: release-please.yml pushes one with the release app's
# token when it creates a release (tags pushed with GITHUB_TOKEN would start
# nothing), and a maintainer may push one by hand. Nothing else starts it,
# so a release runs once.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  IMAGE: ghcr.io/hangar-hub/hangar
  CHARTS: oci://ghcr.io/hangar-hub/charts

jobs:
  binaries:
    name: Binaries (GoReleaser)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # GoReleaser pushes the cask to hangar-hub/homebrew-tap, which
      # GITHUB_TOKEN cannot write to. The release app's token, minted for
      # that repository only, can; it expires when the job ends.
      - id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: hangar-hub
          repositories: homebrew-tap
          permission-contents: write
      # An exact GoReleaser version: this job holds contents: write,
      # id-token: write and the tap token, so a new release must not run
      # here before CI's goreleaser check has seen it. Keep it the same as
      # in ci.yml.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

  image:
    name: Container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # GHCR reads a multi-arch image's description from the index's
          # annotations, not from the labels in each image's config.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
          # metadata-action generates its labels and annotations from the
          # repository: its name as the title, its description, its URL, and
          # the licence GitHub detects, which reads NOASSERTION because GitHub
          # does not detect the Elastic License 2.0. These lists replace
          # them with the Dockerfile's labels, which the generated ones would
          # otherwise override. TestImageMetadataMatchesDockerfile
          # (deploy/release_test.go) keeps all three the same.
          labels: |
            org.opencontainers.image.title=Hangar
            org.opencontainers.image.description=Hangar is a self-hosted model and dataset hub, compatible with the Hugging Face Hub API, git, Ollama and LM Studio.
            org.opencontainers.image.url=https://hangar.page/
            org.opencontainers.image.documentation=https://hangar.page/
            org.opencontainers.image.source=https://github.com/hangar-hub/hangar
            org.opencontainers.image.vendor=Hangar
            org.opencontainers.image.licenses=Elastic-2.0
          annotations: |
            org.opencontainers.image.title=Hangar
            org.opencontainers.image.description=Hangar is a self-hosted model and dataset hub, compatible with the Hugging Face Hub API, git, Ollama and LM Studio.
            org.opencontainers.image.url=https://hangar.page/
            org.opencontainers.image.documentation=https://hangar.page/
            org.opencontainers.image.source=https://github.com/hangar-hub/hangar
            org.opencontainers.image.vendor=Hangar
            org.opencontainers.image.licenses=Elastic-2.0
      - name: Build metadata
        id: vars
        run: |
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(git log -1 --format=%cI)"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
      # Push by digest only: nothing tags the image until the scan passes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            DATE=${{ steps.vars.outputs.date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fail on critical CVEs that have a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Tag last, so a tag never names an image that is unscanned or
      # unsigned. crane tag points each tag at the scanned index without
      # rewriting it, so the digest, its signature and its attestations
      # stay the same.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Tag the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for ref in $TAGS; do
            go run github.com/google/go-containerregistry/cmd/crane@v0.22.1 tag "$IMAGE@$DIGEST" "${ref##*:}"
          done

  chart:
    name: Helm chart
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # cosign reads registry credentials from ~/.docker/config.json, which
      # helm registry login does not write (Helm keeps its own registry
      # config), so log in for cosign as well as for Helm.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          # helm package sets version and appVersion but not annotations, so
          # point Artifact Hub's image list at this release's image.
          sed -i "s|image: $IMAGE:0.0.0|image: $IMAGE:$version|" deploy/helm/hangar/Chart.yaml
          if ! grep -q "image: $IMAGE:$version\$" deploy/helm/hangar/Chart.yaml; then
            echo "Chart.yaml has no artifacthub.io/images entry for $IMAGE:0.0.0 to set" >&2
            exit 1
          fi
          helm package deploy/helm/hangar --version "$version" --app-version "$version" --destination dist
          # The package must carry the chart's README, for helm show readme
          # and Artifact Hub. (grep without -q reads all of tar's output, so
          # pipefail never sees tar killed by SIGPIPE.)
          if ! tar -tzf "dist/hangar-$version.tgz" | grep -x 'hangar/README.md' >/dev/null; then
            echo "the chart package has no README.md" >&2
            exit 1
          fi
          helm push "dist/hangar-$version.tgz" "$CHARTS" 2>&1 | tee push.log
          digest="$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -1)"
          if [ -z "$digest" ]; then
            echo "helm push printed no digest" >&2
            exit 1
          fi
          cosign sign --yes "ghcr.io/hangar-hub/charts/hangar@$digest"

  docs:
    name: Documentation
    needs: [binaries, image, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # mike builds without --strict, so check the site as docs.yml does
      # before anything reaches gh-pages.
      - name: Build with no broken links
        run: make docs
      - name: Publish this version as latest
        id: publish
        env:
          # docs/hooks.py fails the build when it cannot date pages from git.
          DOCS_REQUIRE_GIT_DATES: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The whole history, and no tags: a shallow fetch makes the checkout
          # shallow, and docs/hooks.py then dates every page with the build
          # date rather than its last commit.
          git fetch --no-tags origin gh-pages || true
          before="$(git rev-parse --verify --quiet origin/gh-pages || true)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          version="${TAG#v}"
          uv run --no-project --with-requirements docs/requirements.txt \
            mike deploy --push --update-aliases "${version%.*}" latest
          ./scripts/docs-root-files.sh --push
      # Tells Bing and the other IndexNow search engines which pages changed,
      # once the docs Worker serves them.
      - name: Submit changed pages to IndexNow
        env:
          BEFORE: ${{ steps.publish.outputs.before }}
        run: python3 scripts/indexnow.py "$BEFORE" gh-pages

  demo:
    name: Demo
    needs: [binaries, image, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # A shallow clone cannot always push a new branch.
          fetch-depth: 0
      # Workers Builds watches the demo branch and deploys the mock demo at
      # https://demo.hangar.page/ from it (make demo, then make demo-deploy),
      # so the demo shows the release that /latest/ documents.
      - name: Point the demo branch at this release
        run: git push --force origin "HEAD:refs/heads/demo"
