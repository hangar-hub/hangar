name: Release

# Builds and publishes a release (docs/spec/12-packaging-and-release.md):
# binaries with GoReleaser, the multi-arch image (signed with cosign keyless,
# with an SPDX SBOM attestation and SLSA provenance, scanned with Trivy),
# the Helm chart as an OCI artefact, and the documentation site.
#
# release-please.yml calls it when it creates a release; a tag pushed by a
# person also starts it.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v1.0.0.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/jamesagarside/hangar
  CHARTS: oci://ghcr.io/jamesagarside/charts

jobs:
  binaries:
    name: Binaries (GoReleaser)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

  image:
    name: Container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - name: Build metadata
        id: vars
        run: |
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(git log -1 --format=%cI)"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            DATE=${{ steps.vars.outputs.date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  scan:
    name: Trivy scan
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Fail on critical CVEs that have a fix
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  chart:
    name: Helm chart
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: azure/setup-helm@v5
        with:
          version: v4.1.3
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6
      # cosign reads registry credentials from ~/.docker/config.json, which
      # helm registry login does not write (Helm keeps its own registry
      # config), so log in for cosign as well as for Helm.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package deploy/helm/hangar --version "$version" --app-version "$version" --destination dist
          helm push "dist/hangar-$version.tgz" "$CHARTS" 2>&1 | tee push.log
          digest="$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -1)"
          if [ -z "$digest" ]; then
            echo "helm push printed no digest" >&2
            exit 1
          fi
          cosign sign --yes "ghcr.io/jamesagarside/charts/hangar@$digest"

  docs:
    name: Documentation
    needs: [binaries, image, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Publish this version as latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          version="${TAG#v}"
          uv run --no-project --with-requirements docs/requirements.txt \
            mike deploy --push --update-aliases "${version%.*}" latest
          uv run --no-project --with-requirements docs/requirements.txt mike set-default --push latest
