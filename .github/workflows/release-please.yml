name: Release Please

on:
  push:
    branches: [main]

# The job acts with the release app's token, not GITHUB_TOKEN.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # release-please acts as the hangar-hub-release GitHub App, not with
      # GITHUB_TOKEN: pull requests and tags that GITHUB_TOKEN creates start
      # no workflows, so its release pull requests would get no CI. With the
      # app's token they do, and the tag it pushes for a release starts
      # release.yml through that workflow's tag trigger. That trigger is the
      # only way a release runs, so this workflow does not also call
      # release.yml, which would publish the release twice. It also covers a
      # tag that a maintainer pushes by hand, and keeps the release's signing
      # identity release.yml at refs/tags/v*.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
