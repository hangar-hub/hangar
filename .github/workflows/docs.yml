name: Docs

# Publishes the documentation from main as the `dev` version, next to the
# released versions that release.yml publishes, and the home page and other
# root files in deploy/cloudflare/docs-root (12-packaging-and-release.md).
on:
  push:
    branches: [main]
    paths: ["docs/**", "overrides/**", "mkdocs.yml", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "api/openapi.yaml", "deploy/cloudflare/docs-root/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build with no broken links
        run: make docs
      - name: Publish as dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          uv run --no-project --with-requirements docs/requirements.txt mike deploy --push dev
          ./scripts/docs-root-files.sh --push
