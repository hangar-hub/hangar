name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: House style
        run: make lint-style

  go-test:
    name: Go test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hangar
          POSTGRES_PASSWORD: hangar
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hangar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HANGAR_TEST_POSTGRES_DSN: postgres://hangar:hangar@localhost:5432/postgres?sslmode=disable
      # The S3 Blob store tests run against one MinIO container on the
      # runner's Docker that scripts/with-test-minio.sh starts, as
      # `make test` does.
      HANGAR_TEST_MINIO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test with SQLite and Postgres, and check coverage floors
        # Git-heavy packages can pass but run past go test's 10-minute
        # default on a busy runner (Makefile, GO_TEST_TIMEOUT).
        run: ./scripts/with-test-minio.sh ./scripts/coverage.sh -race -timeout 30m -tags integration
      - name: Blob store conformance
        run: ./scripts/with-test-minio.sh go test -count=1 -run Conformance ./internal/blob/...

  ui:
    name: UI lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - working-directory: ui
        run: pnpm run lint
      - working-directory: ui
        run: pnpm run typecheck
      - working-directory: ui
        run: pnpm run test
      - name: Load test payload helpers
        run: make test-loadtest

  generated:
    name: Generated code is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Generated code, references and dashboards are current
        run: make check-generate PNPM=pnpm

  build:
    name: Build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: make build PNPM=pnpm
      - name: Smoke test the binary
        run: |
          ./bin/hangar version
          ./bin/hangar server --public-url http://localhost:8080 --set server.data_dir="$RUNNER_TEMP/hangar" \
            --set database.dsn="$RUNNER_TEMP/hangar/hangar.db" --set storage.fs.path="$RUNNER_TEMP/hangar/blobs" \
            --set git.cache_dir="$RUNNER_TEMP/hangar/git" &
          for _ in $(seq 1 30); do ./bin/hangar healthcheck && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'

  deploy:
    name: Helm chart, Compose, GoReleaser and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: "~> v2"
      - name: Lint and validate
        run: make lint-deploy

  image:
    name: Container image (linux/amd64 and linux/arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build for the runner and run the quickstart
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hangar:ci
          cache-from: type=gha
      - name: Quickstart answers /readyz
        run: |
          docker run -d --name hangar -p 8080:8080 --read-only --tmpfs /tmp \
            --tmpfs /var/cache/hangar:uid=65532,gid=65532 -v hangar:/var/lib/hangar \
            -e HANGAR_SERVER_PUBLIC_URL=http://localhost:8080 hangar:ci
          ./scripts/smoke.sh --only health http://localhost:8080
          docker logs hangar 2>&1 | grep -q "Admin password"
      - name: The image reads /etc/hangar/hangar.yaml
        run: ./scripts/image-config-check.sh hangar:ci
      - name: The Docker backup recipe works
        run: ./scripts/image-backup-check.sh hangar:ci

  docs:
    name: Documentation builds with no broken links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make docs
