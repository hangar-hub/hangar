site_name: Hangar
site_description: Hangar is a self-hosted model and dataset hub, compatible with the Hugging Face Hub API, git, Ollama and LM Studio.
site_url: https://hangar.page/
repo_url: https://github.com/hangar-hub/hangar
repo_name: hangar-hub/hangar
edit_uri: edit/main/docs/
copyright: Hangar is source-available under the Elastic License 2.0. Hugging Face, Ollama and LM Studio are trademarks of their owners. Hangar is an independent project, not affiliated with or endorsed by them.

# The spec, research notes and build notes live in docs/ for the build, not
# for the site.
exclude_docs: |
  spec/
  research/
  build/
  dependencies.md
  requirements.txt
  hooks.py

hooks:
  - docs/hooks.py

# mike builds each version under its own path. Canonical URLs and the sitemap
# name /latest/ instead, so search results keep their address across releases
# and older versions do not compete with the current one.
plugins:
  - search
  - mike:
      canonical_version: latest
  # Serves the theme's Google Fonts, and the Redoc script the native API page
  # loads, from the site itself, downloaded at build time, so pages render
  # without waiting on another host and a copy of the site works with no
  # internet access (docs/guides/air-gapped.md). The cache is in .cache/,
  # which git ignores.
  - privacy:
      links: false
      assets_include:
        - fonts.googleapis.com/*
        - fonts.gstatic.com/*
        - cdn.jsdelivr.net/*

theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

extra:
  # The logo on every docs page links to the home page, not the version's
  # index, so search engines see https://hangar.page/ as the site's home.
  homepage: https://hangar.page/
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

